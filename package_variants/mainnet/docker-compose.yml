version: "3.8"
services:
  brain:
    build:
      args:
        NETWORK: mainnet
    image: brain.web3signer.dnp.dappnode.eth:2.0.14
  web3signer:
    build:
      args:
        NETWORK: mainnet
        PGPASSWORD: mainnet
        POSTGRES_DB: web3signer-mainnet
        POSTGRES_USER: postgres
    healthcheck:
      test: >-
        curl -H 'Host: web3signer.web3signer.dappnode'
        http://localhost:9000/healthcheck
      interval: 5s
      timeout: 5s
      retries: 100
    image: web3signer.web3signer.dnp.dappnode.eth:2.0.14
  flyway:
    image: floriansaw/flyway-web3signer:25.3.0
    depends_on:
      postgres:
        condition: service_started
    restart: on-failure
  postgres:
    build:
      dockerfile: Dockerfile.alpine
      args:
        POSTGRES_PASSWORD: mainnet
        PGPASSWORD: mainnet
        POSTGRES_DB: web3signer-mainnet
        POSTGRES_USER: postgres
    image: postgres.web3signer.dnp.dappnode.eth:2.0.14
